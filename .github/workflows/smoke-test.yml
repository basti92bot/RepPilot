name: RepPilot Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run smoke test
        run: |
          CURRENT_VERSION=$(node -p "require('./version.json').version")
          sed "s/11\\.8\\.125/${CURRENT_VERSION}/g" smoke-test.js > smoke-test.current.js
          node smoke-test.current.js
      - name: Run PWA reliability test
        run: node pwa-reliability-test.js
      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start local RepPilot server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/reppilot-http.log 2>&1 &
          echo $! > /tmp/reppilot-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/reppilot-http.log
          exit 1
      - name: Run browser E2E
        run: |
          CURRENT_VERSION=$(node -p "require('./version.json').version")
          sed "s/11\\.8\\.125/${CURRENT_VERSION}/g" browser-e2e-test.mjs > browser-e2e-test.current.mjs
          node browser-e2e-test.current.mjs
      - name: Verify live GitHub Pages deployment
        run: node live-deployment-test.mjs
