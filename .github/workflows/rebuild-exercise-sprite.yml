name: Rebuild Exercise Sprite

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebuild-exercise-sprite.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild exact sprite
        run: |
          cat .tmp/exercise-sprite-part-*.b64 | tr -d '\n\r ' | base64 -d > exercise-sprite-v11.8.116.webp
          test "$(wc -c < exercise-sprite-v11.8.116.webp | tr -d ' ')" = "24518"
          echo "be59370272f3912b76aba13a0cbf61ec24bdc3ebcdf21644dc46c25e0b9d8835  exercise-sprite-v11.8.116.webp" | sha256sum -c -
      - name: Commit sprite
        run: |
          git config user.name "RepPilot CI"
          git config user.email "actions@users.noreply.github.com"
          git add exercise-sprite-v11.8.116.webp
          git commit -m "Add verified exercise sprite v11.8.116"
          git push
