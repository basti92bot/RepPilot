<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RepPilot">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>RepPilot</title>
  <style>
    html,body{margin:0;min-height:100%;background:#111827;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{max-width:420px;text-align:center}
    h1{font-size:34px;margin:0 0 14px}
    p{font-size:18px;line-height:1.45;margin:8px 0;color:#e5e7eb}
    strong{color:#fff}
  </style>
</head>
<body>
  <main>
    <h1>RepPilot</h1>
    <p>Diese Seite ist nur für die Home-Bildschirm-Installation.</p>
    <p><strong>Teilen → Zum Home-Bildschirm → Hinzufügen</strong></p>
  </main>
  <script>
    (() => {
      const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      if (standalone) location.replace('/RepPilot/');
    })();
  </script>
</body>
</html>
